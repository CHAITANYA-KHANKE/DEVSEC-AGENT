[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg2://devsecagent:devsecagent@localhost:5432/devsecagent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
