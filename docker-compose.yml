version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: devsecagent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsecagent
      POSTGRES_PASSWORD: devsecagent
      POSTGRES_DB: devsecagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Optional: pgadmin for inspection
  # pgadmin:
  #   image: dpage/pgadmin4
  #   ports: ["5050:80"]

volumes:
  pgdata:
